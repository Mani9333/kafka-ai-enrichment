[project]
name = "kafka-ai-enrichment"
version = "0.1.0"
description = "Real-time Kafka pipeline that enriches events with an LLM (sentiment/category/entities), with a dead-letter queue, consumer-lag dashboard, and Kafka UI."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
